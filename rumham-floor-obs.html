<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🥧 The Pie — OBS Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f6c90e; --gold2:#d4a80a;
  --text:#f3ead9; --muted:#a8946e;
  --win:#4ade80; --lose:#f87171;
  --silver:#cbd5e1; --bronze:#d97706;
  --grad-gold:linear-gradient(135deg,#f6c90e,#d4880a);
  --neon-pink:#ff2ea6; --neon-cyan:#2ee6ff; --neon-purple:#b026ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:19px;}
html,body{width:100%;height:100%;overflow:hidden;color:var(--text);font-family:'Barlow Condensed',sans-serif;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 12% 0%, rgba(255,46,166,0.16), transparent 60%),
    radial-gradient(ellipse 900px 500px at 88% 0%, rgba(46,230,255,0.16), transparent 60%),
    radial-gradient(circle at 50% 30%, #14101f 0%, #0a0714 55%, #050308 100%);
}
body::before{ /* starfield */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-3;
  background-image:
    radial-gradient(1.5px 1.5px at 8% 15%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 22% 8%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 35% 22%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 65% 12%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 78% 25%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 92% 10%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 15% 60%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.4), transparent);
  background-size:100% 100%;
}
.side-dots{
  position:fixed;top:0;bottom:0;width:220px;pointer-events:none;z-index:-2;opacity:0.5;
  background-image:radial-gradient(circle, rgba(255,46,166,0.55) 1.6px, transparent 1.6px),
    radial-gradient(circle, rgba(46,230,255,0.4) 1.6px, transparent 1.6px);
  background-size:26px 26px, 26px 26px;
  background-position:0 0, 13px 13px;
  -webkit-mask-image:linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
  mask-image:linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
}
.side-dots.left{left:0;-webkit-mask-image:linear-gradient(to right, black, transparent),linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);}
.side-dots.right{right:0;-webkit-mask-image:linear-gradient(to left, black, transparent),linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);}

.stage{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.1rem;position:relative;padding-top:140px;padding-bottom:80px;}

.stage-spotlight{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1200px;height:1200px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at center,rgba(246,201,14,0.14) 0%,rgba(255,46,166,0.06) 30%,rgba(46,230,255,0.03) 50%,transparent 68%);
}

@keyframes neonPulse{
  0%,100%{box-shadow:0 0 12px rgba(246,201,14,0.5),0 0 26px rgba(246,201,14,0.25),inset 0 0 10px rgba(246,201,14,0.12);}
  50%{box-shadow:0 0 20px rgba(255,46,166,0.55),0 0 40px rgba(255,46,166,0.3),inset 0 0 14px rgba(255,46,166,0.15);}
}
@keyframes neonBorderCycle{
  0%,100%{border-color:var(--gold);}
  33%{border-color:var(--neon-pink);}
  66%{border-color:var(--neon-cyan);}
}
@keyframes bulbTwinkle{0%,100%{opacity:1;}50%{opacity:0.4;}}

.marquee{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) skewX(-3deg);z-index:10;
  padding:0.85rem 2.6rem 0.6rem;border-radius:16px;
  background:radial-gradient(ellipse at 50% 0%, rgba(30,10,25,0.95), rgba(8,4,10,0.96));
  border:3px solid var(--neon-pink);
  box-shadow:0 0 18px rgba(255,46,166,0.6),0 0 40px rgba(255,46,166,0.3),inset 0 0 20px rgba(255,46,166,0.15);
}
.marquee::before,.marquee::after{
  content:'';position:absolute;left:10px;right:10px;height:6px;
  background-image:radial-gradient(circle, #ffd54f 2px, transparent 2.2px);
  background-size:16px 6px;background-repeat:repeat-x;
  animation:bulbTwinkle 1.6s ease-in-out infinite;
}
.marquee::before{top:6px;}
.marquee::after{bottom:6px;animation-delay:0.8s;}
.marquee-inner{transform:skewX(3deg);text-align:center;display:flex;align-items:center;gap:1rem;}
.mq-logo{height:68px;width:auto;display:block;filter:drop-shadow(0 0 8px rgba(246,201,14,0.45));}
.mq-line1{font-family:'Bebas Neue',cursive;letter-spacing:0.1em;line-height:0.95;font-size:2.6rem;
  background:linear-gradient(90deg,var(--neon-pink),var(--neon-cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:0 0 16px rgba(255,46,166,0.4),0 0 30px rgba(46,230,255,0.3);}
.mq-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.35em;
  text-transform:uppercase;color:var(--muted);margin-top:0.2rem;}

.round-badge{
  position:fixed;top:26px;left:26px;display:flex;align-items:center;gap:0.6rem;
  background:rgba(10,6,14,0.9);border:2px solid var(--neon-pink);border-radius:99px;
  padding:0.5rem 1.1rem;font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:0.08em;color:var(--gold);
  box-shadow:0 0 14px rgba(255,46,166,0.4),inset 0 0 8px rgba(255,46,166,0.12);
}
.round-badge .dot-grid{display:grid;grid-template-columns:repeat(3,4px);gap:2px;}
.round-badge .dot-grid span{width:4px;height:4px;border-radius:1px;background:var(--neon-pink);opacity:0.9;}

.progress-badge{
  position:fixed;top:26px;right:26px;
  background:rgba(6,10,14,0.9);border:2px solid var(--neon-cyan);border-radius:99px;
  padding:0.5rem 1.1rem;font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:0.05em;color:var(--text);
  display:flex;align-items:center;gap:0.7rem;
  box-shadow:0 0 14px rgba(46,230,255,0.4),inset 0 0 8px rgba(46,230,255,0.12);
}
.progress-badge .dot-track{display:flex;align-items:center;gap:4px;}
.progress-badge .dot-track .pd{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15);}
.progress-badge .dot-track .pd.on{background:var(--gold);box-shadow:0 0 6px var(--gold);}
.progress-badge .dot-track .line{width:14px;height:2px;background:rgba(255,255,255,0.15);}

.wheel-wrap{position:relative;width:min(700px, 56vh);height:min(700px, 56vh);}
.floor-glow{
  position:absolute;left:50%;bottom:-13%;transform:translateX(-50%);
  width:106%;height:21%;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(255,46,166,0.35) 0%, rgba(46,230,255,0.18) 45%, transparent 75%);
  filter:blur(6px);
}
.floor-glow::after{
  content:'';position:absolute;inset:24% 9%;border-radius:50%;
  border:2px solid rgba(255,46,166,0.4);box-shadow:0 0 20px rgba(46,230,255,0.35);
}
svg#wheelSvg{width:100%;height:100%;filter:drop-shadow(0 8px 30px rgba(0,0,0,0.6));position:relative;z-index:1;}
#wheelGroup{transform-origin:200px 200px;transition:transform 3.2s cubic-bezier(.17,.67,.14,1);}
.wheel-ring{fill:none;stroke:var(--neon-pink);stroke-width:6;filter:drop-shadow(0 0 10px rgba(255,46,166,0.8)) drop-shadow(0 0 22px rgba(255,46,166,0.4));}
.wedge-label{font-family:'Bebas Neue',cursive;font-size:20px;fill:#0a0810;text-anchor:middle;pointer-events:none;letter-spacing:0.03em;text-transform:uppercase;}
.wedge-cat{display:none;}
.wedge-photo-name{font-family:'Bebas Neue',cursive;font-size:17px;font-weight:700;fill:#fff;text-anchor:middle;letter-spacing:0.02em;text-shadow:0 1px 3px rgba(0,0,0,0.85);}
.wedge-photo-cat{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;fill:var(--gold);text-anchor:middle;text-transform:uppercase;letter-spacing:0.06em;}
.hub{fill:#0a0710;stroke:var(--gold);stroke-width:4;filter:drop-shadow(0 0 10px rgba(246,201,14,0.7));}
.hub-text{fill:var(--gold);font-family:'Bebas Neue',cursive;font-size:26px;text-anchor:middle;}
.wedge-path{transition:opacity 0.4s ease;}
.wedge-active{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 20px var(--neon-pink));animation:wedgeActivePulse 1.4s ease-in-out infinite;}
@keyframes wedgeActivePulse{
  0%,100%{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 18px rgba(255,46,166,0.5));}
  50%{filter:drop-shadow(0 0 18px var(--neon-pink)) drop-shadow(0 0 28px rgba(46,230,255,0.5));}
}
.wedge-neighbor{filter:drop-shadow(0 0 10px var(--neon-cyan));opacity:0.96;}
.wedge-dimmed{filter:grayscale(0.9) brightness(0.42);opacity:0.75;transition:filter 0.5s ease,opacity 0.5s ease;}
.label-dimmed{opacity:0.45;transition:opacity 0.5s ease;}
@keyframes wedgePulse{
  0%{filter:drop-shadow(0 0 4px var(--gold));}
  33%{filter:drop-shadow(0 0 30px var(--neon-pink));}
  66%{filter:drop-shadow(0 0 30px var(--neon-cyan));}
  100%{filter:drop-shadow(0 0 4px var(--gold));}
}
.wedge-justwon{animation:wedgePulse 1.1s ease-in-out 2;}

.pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
  border-top:26px solid var(--gold);filter:drop-shadow(0 0 10px rgba(246,201,14,0.8)) drop-shadow(0 2px 6px rgba(0,0,0,0.5));z-index:5;
}

.banner{
  background:rgba(8,5,10,0.9);border:2px solid rgba(246,201,14,0.5);border-radius:14px;
  padding:0.9rem 1.8rem;text-align:center;min-width:340px;position:relative;overflow:hidden;
  box-shadow:0 0 16px rgba(246,201,14,0.25);transition:border-color 0.3s,box-shadow 0.3s;
}
.banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--grad-gold);}
.banner .eyebrow{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--gold);margin-bottom:0.35rem;font-weight:700;}
.banner .main-text{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:0.03em;}
.banner.banner-alert{
  border-color:var(--neon-pink);box-shadow:0 0 26px rgba(255,46,166,0.5),0 0 46px rgba(255,46,166,0.25);
  animation:alertPulse 1s ease-in-out infinite;
}
.banner.banner-alert::after{background:linear-gradient(90deg,var(--neon-pink),var(--neon-cyan));}
.banner.banner-alert .eyebrow{color:var(--neon-pink);}
@keyframes alertPulse{
  0%,100%{box-shadow:0 0 20px rgba(255,46,166,0.4),0 0 36px rgba(255,46,166,0.2);}
  50%{box-shadow:0 0 34px rgba(255,46,166,0.7),0 0 60px rgba(255,46,166,0.4);}
}

.match-crest{
  border-radius:50%;background-size:contain;background-position:center;background-repeat:no-repeat;
  background-color:#0d0a12;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',cursive;font-size:1.4rem;overflow:hidden;
}
.match-name{font-family:'Bebas Neue',cursive;font-size:2.1rem;letter-spacing:0.03em;line-height:1.05;color:#fff;}
.match-cat{
  display:inline-block;color:var(--gold);font-size:1rem;text-transform:uppercase;letter-spacing:0.06em;
  margin-top:0.5rem;font-weight:700;padding:0.25rem 0.9rem;border:2px solid var(--gold);border-radius:99px;
  background:rgba(246,201,14,0.1);
}

.wheel-row{display:flex;align-items:center;justify-content:center;gap:2.4rem;}

.side-card{
  width:320px;text-align:center;background:rgba(8,6,10,0.9);border:2px solid rgba(255,255,255,0.16);
  border-radius:22px;padding:1.7rem 1.3rem 1.9rem;position:relative;flex-shrink:0;transition:border-color 0.3s,box-shadow 0.3s;
}
.side-card.side-left{border-color:var(--neon-pink);box-shadow:0 0 20px rgba(255,46,166,0.3),inset 0 0 14px rgba(255,46,166,0.08);}
.side-card.side-right{border-color:var(--neon-cyan);box-shadow:0 0 20px rgba(46,230,255,0.3),inset 0 0 14px rgba(46,230,255,0.08);}
.side-card.side-left .side-card-label{color:var(--neon-pink);}
.side-card.side-right .side-card-label{color:var(--neon-cyan);}
.side-card.is-duelling.side-left{animation:neonPulsePink 2.2s ease-in-out infinite;}
.side-card.is-duelling.side-right{animation:neonPulseCyan 2.2s ease-in-out infinite;}
@keyframes neonPulsePink{
  0%,100%{box-shadow:0 0 20px rgba(255,46,166,0.35);}
  50%{box-shadow:0 0 34px rgba(255,46,166,0.65),0 0 50px rgba(255,46,166,0.3);}
}
@keyframes neonPulseCyan{
  0%,100%{box-shadow:0 0 20px rgba(46,230,255,0.35);}
  50%{box-shadow:0 0 34px rgba(46,230,255,0.65),0 0 50px rgba(46,230,255,0.3);}
}
.side-card-label{
  font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.2em;
  color:var(--muted);margin-bottom:1rem;font-weight:700;position:relative;
}
.side-card .match-crest{
  width:145px;height:145px;margin:0 auto 0.9rem;font-size:3rem;background-color:rgba(255,255,255,0.04);
  border:3px solid currentColor;
}
.side-card.side-left .match-crest{color:var(--neon-pink);box-shadow:0 0 20px rgba(255,46,166,0.5),inset 0 0 14px rgba(255,46,166,0.15);}
.side-card.side-right .match-crest{color:var(--neon-cyan);box-shadow:0 0 20px rgba(46,230,255,0.5),inset 0 0 14px rgba(46,230,255,0.15);}
.side-card .match-name{border-bottom:2px solid rgba(255,255,255,0.15);padding-bottom:0.4rem;display:inline-block;}
.side-card .match-cat{display:block;margin:0.7rem auto 0;width:fit-content;}

.points-badge{
  margin-top:1.1rem;padding:0.5rem 0;border-radius:10px;
  font-family:'Bebas Neue',cursive;font-size:2.4rem;letter-spacing:0.03em;line-height:1;
  border:2px solid rgba(255,255,255,0.15);color:var(--text);background:rgba(255,255,255,0.04);
}
.points-badge .pts-lbl{display:block;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-top:0.15rem;}
.points-badge.winner{border-color:var(--win);background:rgba(74,222,128,0.18);color:var(--win);
  box-shadow:0 0 18px rgba(74,222,128,0.4),inset 0 0 10px rgba(74,222,128,0.15);}
.points-badge.winner .pts-lbl{color:var(--win);}
.points-badge.loser{border-color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:var(--muted);}
.points-badge.tie{border-color:var(--neon-pink);background:rgba(255,46,166,0.15);color:var(--neon-pink);
  box-shadow:0 0 18px rgba(255,46,166,0.4);}
.points-badge.tie .pts-lbl{color:var(--neon-pink);}




.winner-banner{text-align:center;}
.winner-banner .match-crest{width:180px;height:180px;font-size:3.4rem;margin:0 auto 1.1rem;box-shadow:0 0 40px rgba(246,201,14,0.45);border:3px solid var(--gold);}
.winner-banner .eyebrow{font-size:0.85rem;letter-spacing:0.25em;color:var(--gold);margin-bottom:0.6rem;font-weight:700;text-transform:uppercase;}
.winner-banner h1{font-family:'Bebas Neue',cursive;font-size:3rem;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,0.6);letter-spacing:0.04em;}

.confetti-piece{
  position:fixed;top:-20px;width:10px;height:16px;opacity:0.95;pointer-events:none;z-index:50;
  animation-name:confetti-fall;animation-timing-function:cubic-bezier(.37,0,.63,1);animation-fill-mode:forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(105vh) rotate(720deg);opacity:0.9;}
}

.empty-hint{color:var(--muted);font-size:1rem;text-align:center;font-family:'Barlow Condensed',sans-serif;}

.category-footer{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:0.55rem;flex-wrap:wrap;justify-content:center;max-width:92vw;
}
.category-chip{
  display:flex;align-items:center;gap:0.4rem;padding:0.4rem 0.9rem;border-radius:99px;
  background:rgba(10,8,4,0.85);border:1.5px solid rgba(246,201,14,0.4);
  font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.03em;
  color:var(--text);text-transform:uppercase;white-space:nowrap;transition:opacity 0.4s ease,border-color 0.4s ease;
}
.category-chip .cc-crest{width:16px;height:16px;border-radius:4px;background-size:cover;background-position:center;flex-shrink:0;}
.category-chip.eliminated{
  border-color:rgba(255,255,255,0.12);color:var(--muted);opacity:0.55;
  text-decoration:line-through;text-decoration-color:var(--lose);text-decoration-thickness:2px;
}

.hidden{display:none !important;}

/* ===== GAME SHOW LAYER ===== */
.stinger{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;overflow:hidden;}
.stinger.show{display:flex;animation:stFade var(--st-ms,2200ms) ease forwards;}
.stinger::before{content:'';position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 50%,transparent 0 8%,var(--st-c) 8% 10%,transparent 10% 18%,var(--st-c) 18% 20%,transparent 20% 28%,var(--st-c) 28% 30%,transparent 30% 38%,var(--st-c) 38% 40%,transparent 40% 48%,var(--st-c) 48% 50%,transparent 50% 58%,var(--st-c) 58% 60%,transparent 60% 68%,var(--st-c) 68% 70%,transparent 70% 78%,var(--st-c) 78% 80%,transparent 80% 88%,var(--st-c) 88% 90%,transparent 90%);opacity:.22;animation:stSpin 6s linear infinite;}
.stinger::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(5,3,8,.55) 0%,rgba(5,3,8,.9) 75%);z-index:-1;}
.st-main{font-family:'Bebas Neue',cursive;font-size:min(13vw,9rem);letter-spacing:.06em;line-height:.95;color:#fff;transform:skewX(-6deg);
  text-shadow:0 0 30px var(--st-c),0 0 70px var(--st-c),0 6px 0 rgba(0,0,0,.6);animation:stSlam .55s cubic-bezier(.2,1.6,.4,1) both;text-align:center;padding:0 2rem;}
.st-sub{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:min(4.2vw,2.6rem);letter-spacing:.2em;text-transform:uppercase;color:var(--st-c);margin-top:.8rem;
  text-shadow:0 0 18px var(--st-c);animation:stRise .6s .35s ease both;text-align:center;padding:0 2rem;}
@keyframes stSlam{0%{transform:skewX(-6deg) scale(3.2);opacity:0}60%{opacity:1}100%{transform:skewX(-6deg) scale(1);opacity:1}}
@keyframes stRise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes stFade{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes stSpin{to{transform:rotate(360deg)}}
.flash{position:fixed;inset:0;background:#fff;z-index:600;pointer-events:none;opacity:0;}
.flash.go{animation:flashGo .45s ease-out;}
@keyframes flashGo{0%{opacity:.85}100%{opacity:0}}
body.shake .stage{animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(5px,6px)}80%{transform:translate(-3px,2px)}}
.board{position:fixed;top:84px;left:26px;z-index:9;width:250px;background:rgba(10,6,14,.88);border:2px solid var(--neon-cyan);border-radius:14px;padding:.5rem .7rem;box-shadow:0 0 14px rgba(46,230,255,.35);}
.board h4{font-family:'Bebas Neue',cursive;letter-spacing:.14em;color:var(--neon-cyan);font-size:.95rem;margin-bottom:.25rem;}
.board .row{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.95rem;padding:.12rem 0;transition:transform .5s;}
.board .row b{font-family:'Bebas Neue',cursive;color:var(--gold);width:1rem;}
.board .row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.board .row em{font-style:normal;font-family:'Bebas Neue',cursive;color:var(--gold);font-size:1.1rem;}
.board .row.out{opacity:.45;}
</style>
</head>
<body>

<div class="side-dots left"></div>
<div class="side-dots right"></div>
<div class="stage-spotlight"></div>

<script>
const STORAGE_KEY = "rumham_floor_state";

let lastRenderedHash = null;
let lastSpinSeq = null;
let cumulativeRotation = 0;
let lastRoundWinKey = null;
let lastDuelStartKey = null;

// ══════════════════════════════════════
// SOUND EFFECTS — synthesized via Web Audio API, no external audio files
// ══════════════════════════════════════
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
// some browsers block audio until a user gesture — this unlocks it on first click/keypress
window.addEventListener("click", () => getAudioCtx(), { once: true });
window.addEventListener("keydown", () => getAudioCtx(), { once: true });

function playTone(freq, startTime, duration, type, gainLevel){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, startTime);
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.linearRampToValueAtTime(gainLevel || 0.2, startTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function playSpinWhoosh(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const dur = 1.6;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.Q.value = 0.9;
  filter.frequency.setValueAtTime(180, now);
  filter.frequency.exponentialRampToValueAtTime(2600, now + dur * 0.45);
  filter.frequency.exponentialRampToValueAtTime(160, now + dur);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.32, now + 0.15);
  gain.gain.linearRampToValueAtTime(0.0001, now + dur);
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start(now);
  noise.stop(now + dur + 0.1);
}

function playDuelDing(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  playTone(880, now, 0.32, "triangle", 0.22);
  playTone(1318.5, now + 0.07, 0.28, "triangle", 0.14);
}

function playRoundWinFanfare(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, now + i * 0.11, 0.3, "square", 0.16));
}

function playFinalFanfare(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  [523.25, 523.25, 523.25, 659.25, 783.99, 1046.5, 1046.5, 1318.5].forEach((f, i) =>
    playTone(f, now + i * 0.15, 0.42, "sawtooth", 0.15)
  );
}
let spinAnimating = false;

function teamHue(name){ return (name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*47)%360; }
function teamInitials(name){ return name.split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3) || '?'; }
function crestStyle(p){
  if (p.photo) return `background-image:url(${p.photo});`;
  const hue = teamHue(p.name);
  return `background:hsl(${hue},45%,16%);color:hsl(${hue},70%,68%);`;
}
function getPlayer(state, id){ return state.players.find(p => p.id === id); }

function wedgeLayout(state){
  const order = state.wheelOrder;
  const totalWeight = order.reduce((s,id)=>s+getPlayer(state,id).weight, 0);
  let angle = -90;
  return order.map(id => {
    const p = getPlayer(state, id);
    const sweep = (p.weight/totalWeight) * 360;
    const layout = { id, p, start: angle, sweep, mid: angle + sweep/2 };
    angle += sweep;
    return layout;
  });
}

function neighborIds(state, id){
  const order = state.wheelOrder;
  const idx = order.indexOf(id);
  const n = order.length;
  if (idx === -1 || n < 2) return [];
  return [order[(idx-1+n)%n], order[(idx+1)%n]];
}

function renderWheelSvg(state, opts={}){
  document.getElementById("wheelWrap").classList.remove("hidden");
  const cx = 200, cy = 200, r = 180;
  const layout = wedgeLayout(state);
  const neighborSet = opts.neighborHighlight || [];
  const justWonId = opts.justWon || null;
  const dimOthers = !!opts.dimOthers;

  let defs = `<defs>`;
  layout.forEach(w => {
    if (w.p.photo){
      // Size the image so it fully covers the wedge at any sweep angle: a square anchored
      // bottom-center at the wheel's true center, extending outward, then rotated around
      // that same center so the photo's bottom sits at the hub and its top points to the rim.
      const imgSize = r * 2.2;
      const rotateDeg = w.mid + 90;
      defs += `<pattern id="pat-${w.id}" patternUnits="userSpaceOnUse" width="400" height="400" patternTransform="rotate(${rotateDeg} ${cx} ${cy})">
        <image href="${w.p.photo}" x="${cx - imgSize/2}" y="${cy - imgSize}" width="${imgSize}" height="${imgSize}" preserveAspectRatio="xMidYMid slice"/>
      </pattern>`;
    }
  });
  defs += `</defs>`;

  let html = defs;
  layout.forEach(w => {
    const a0 = w.start * Math.PI/180, a1 = (w.start+w.sweep) * Math.PI/180;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const large = w.sweep > 180 ? 1 : 0;
    const fill = w.p.photo ? `url(#pat-${w.id})` : `hsl(${teamHue(w.p.name)},55%,52%)`;
    const isActive = w.id === state.activeId || w.id === state.opponentId;
    const isNeighbor = neighborSet.includes(w.id);
    const isJustWon = w.id === justWonId;
    let cls = "wedge-path";
    if (isActive) cls += " wedge-active";
    else if (isNeighbor) cls += " wedge-neighbor";
    if (isJustWon) cls += " wedge-justwon";
    if (dimOthers && !isActive) cls += " wedge-dimmed";
    html += `<path class="${cls}" d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${fill}" stroke="#0e0c07" stroke-width="2.5" />`;

    const midA = w.mid * Math.PI/180;
    const lx2 = cx + (r*0.74)*Math.cos(midA), ly2 = cy + (r*0.74)*Math.sin(midA);
    html += `<g transform="rotate(${-cumulativeRotation} ${lx2} ${ly2})" class="${dimOthers && !isActive ? 'label-dimmed' : ''}">
      <rect x="${lx2-58}" y="${ly2-26}" width="116" height="44" rx="9" fill="rgba(4,2,8,0.62)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="${lx2}" y="${ly2-6}" class="wedge-photo-name">${w.p.name}</text>
      <text x="${lx2}" y="${ly2+13}" class="wedge-photo-cat">${w.p.category}</text>
    </g>`;
  });

  document.getElementById("wheelGroup").innerHTML = html;
  document.getElementById("hubCount").textContent = state.wheelOrder.length;
}

function hideAllBanners(){
  document.getElementById("statusBanner").classList.add("hidden");
  document.getElementById("winnerBanner").classList.add("hidden");
  hideSideCards();
}

function showStatusBanner(eyebrow, main){
  hideAllBanners();
  setStatusText(eyebrow, main);
}

function setStatusText(eyebrow, main, alert=false){
  const banner = document.getElementById("statusBanner");
  banner.classList.remove("hidden");
  banner.classList.toggle("banner-alert", !!alert);
  document.getElementById("bannerEyebrow").textContent = eyebrow;
  document.getElementById("bannerMain").textContent = main;
}

function hideSideCards(){
  ["leftCard","rightCard"].forEach(id => {
    const el = document.getElementById(id);
    el.classList.add("hidden");
    el.classList.remove("is-duelling");
  });
  ["leftPoints","rightPoints"].forEach(id => {
    const el = document.getElementById(id);
    el.className = "points-badge hidden";
  });
}

function fillSideCard(side, p, label, showCategory, highlight, isController){
  const card = document.getElementById(side+"Card");
  card.classList.remove("hidden");
  card.classList.toggle("is-duelling", !!highlight);
  document.getElementById(side+"Label").innerHTML = isController ? `👑 ${label}` : label;
  const crest = document.getElementById(side+"Crest");
  crest.style.cssText = crestStyle(p);
  crest.textContent = p.photo ? "" : teamInitials(p.name);
  document.getElementById(side+"Name").textContent = p.name;
  document.getElementById(side+"Cat").textContent = showCategory ? p.category : "";
}

function showPickCards(state){
  hideAllBanners();
  const neighbors = neighborIds(state, state.activeId);
  if (neighbors.length < 2) return;
  const leftP = getPlayer(state, neighbors[0]);
  const rightP = getPlayer(state, neighbors[1]);
  fillSideCard("left", leftP, "Could Challenge ⬅", true, false);
  fillSideCard("right", rightP, "Could Challenge ➡", true, false);
}

function showDuelCards(state, reveal=false){
  hideAllBanners();
  const active = getPlayer(state, state.activeId);
  const opponent = getPlayer(state, state.opponentId);
  const leftLabel = (reveal && state.ownershipChanged) ? "New Controller" : "On The Pie";

  fillSideCard("left", active, leftLabel, true, true, true);
  fillSideCard("right", opponent, "Playing Against", true, true, false);

  const leftBadge = document.getElementById("leftPoints");
  const rightBadge = document.getElementById("rightPoints");
  if (reveal && state.answers){
    const leftScore = state.answers[active.id] ?? 0;
    const rightScore = state.answers[opponent.id] ?? 0;
    const tie = leftScore === rightScore;
    leftBadge.className = `points-badge ${tie ? "tie" : (leftScore > rightScore ? "winner" : "loser")}`;
    document.getElementById("leftPointsNum").textContent = leftScore;
    rightBadge.className = `points-badge ${tie ? "tie" : (rightScore > leftScore ? "winner" : "loser")}`;
    document.getElementById("rightPointsNum").textContent = rightScore;
  } else {
    leftBadge.className = "points-badge hidden";
    rightBadge.className = "points-badge hidden";
  }
}

function launchConfetti(opts={}){
  const colors = ["#f6c90e","#d4880a","#4ade80","#f87171","#93c5fd","#f3ead9"];
  const count = opts.count || 110;
  const centerVw = opts.overSide === "left" ? 22 : opts.overSide === "right" ? 78 : 50;
  const spreadVw = opts.overSide ? 26 : 90;
  for (let i = 0; i < count; i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const left = centerVw + (Math.random() - 0.5) * spreadVw;
    const duration = 2.4 + Math.random() * 1.6;
    const delay = Math.random() * 1.0;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 7 + Math.random() * 7;
    piece.style.left = Math.max(0, Math.min(100, left)) + "vw";
    piece.style.background = color;
    piece.style.width = size + "px";
    piece.style.height = (size * 1.6) + "px";
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.animationDuration = duration + "s";
    piece.style.animationDelay = delay + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
  }
}

function showWinnerBanner(state){
  hideAllBanners();
  document.getElementById("wheelWrap").classList.add("hidden");
  const w = state.players.find(p => p.id === state.wheelOrder[0]);
  document.getElementById("winnerBanner").classList.remove("hidden");
  const crest = document.getElementById("winnerCrest");
  crest.style.cssText = crestStyle(w);
  crest.textContent = w.photo ? "" : teamInitials(w.name);
  document.getElementById("winnerName").textContent = w.name;
  playFinalFanfare();
  launchConfetti({ count: 110 });
  setTimeout(() => launchConfetti({ count: 110 }), 2200);
  setTimeout(() => launchConfetti({ count: 110 }), 4400);
}

function updateBadges(state){
  document.getElementById("roundBadgeText").textContent = `Round ${state.roundNumber || 1}`;
  const remaining = state.wheelOrder.length;
  const total = state.players.length;
  document.getElementById("progressText").textContent = `${remaining}/${total}`;

  const dotsEl = document.getElementById("progressDots");
  const maxDots = Math.min(total, 10); // cap visual dots for very large games
  let dotsHtml = "";
  for (let i = 0; i < maxDots; i++){
    dotsHtml += `<span class="pd ${i < remaining ? 'on' : ''}"></span>`;
    if (i < maxDots - 1) dotsHtml += `<span class="line"></span>`;
  }
  dotsEl.innerHTML = dotsHtml;
}

function renderCategoryFooter(state){
  const footer = document.getElementById("categoryFooter");
  if (!footer) return;
  footer.innerHTML = state.players.map(p => {
    const isOut = !state.wheelOrder.includes(p.id);
    const crestBit = p.photo ? `<span class="cc-crest" style="background-image:url(${p.photo})"></span>` : "";
    return `<div class="category-chip ${isOut ? 'eliminated' : ''}">${crestBit}${p.category}</div>`;
  }).join("");
}

function renderPhaseVisuals(state){
  if (state.phase === "spin"){
    renderWheelSvg(state);
    showStatusBanner("Up next", "Waiting for the host to pick a team…");
  } else if (state.phase === "pick"){
    const p = getPlayer(state, state.activeId);
    const neighbors = neighborIds(state, state.activeId);
    renderWheelSvg(state, { neighborHighlight: neighbors });
    showPickCards(state);
    setStatusText("On the pie", `${p.name} is choosing a direction`);
  } else if (state.phase === "duel"){
    const opponent = getPlayer(state, state.opponentId);
    renderWheelSvg(state, { dimOthers: true });
    showDuelCards(state, false);
    setStatusText("Category", opponent.category);

    const duelKey = `${state.roundNumber}-${state.activeId}-${state.opponentId}`;
    if (duelKey !== lastDuelStartKey){
      lastDuelStartKey = duelKey;
      playDuelDing();
    }
  } else if (state.phase === "tiebreak"){
    renderWheelSvg(state, { dimOthers: true });
    showDuelCards(state, true);
    setStatusText("Tiebreak", "Scores are level — host to decide");
  } else if (state.phase === "continuePass"){
    const p = getPlayer(state, state.activeId);
    const loser = getPlayer(state, state.opponentId);
    alignActiveToTop(state);
    renderWheelSvg(state, { justWon: state.activeId, dimOthers: true });
    showDuelCards(state, true);
    if (state.ownershipChanged){
      setStatusText("⚡ Control Changed", `${p.name} steals the pie from ${loser.name}!`, true);
    } else {
      setStatusText("Round winner", `${p.name} takes the slice!`, false);
    }

    const winKey = `${state.roundNumber}-${state.activeId}`;
    if (winKey !== lastRoundWinKey){
      lastRoundWinKey = winKey;
      launchConfetti({ overSide: "left", count: 60 }); // active/winning team's card is always on the left now
      playRoundWinFanfare();
    }
  }
}

function alignActiveToTop(state){
  // rotates the wheel so the round winner's (now enlarged) wedge sits under the top pointer
  const layout = wedgeLayout(state);
  const target = layout.find(w => w.id === state.activeId);
  if (!target) return;
  // shortest-path delta, in (-180, 180], so this is a quick snap rather than a full spin
  let delta = ((-90 - target.mid - cumulativeRotation) % 360 + 540) % 360 - 180;
  cumulativeRotation += delta;
  const group = document.getElementById("wheelGroup");
  if (group) group.style.transform = `rotate(${cumulativeRotation}deg)`;
}

function triggerSpin(state){
  spinAnimating = true;
  hideAllBanners();
  showStatusBanner("Spinning", "Who's up next…?");
  playSpinWhoosh();

  const preSpinState = { ...state, activeId: null, opponentId: null };
  renderWheelSvg(preSpinState);

  const layout = wedgeLayout(state);
  const target = layout.find(w => w.id === state.activeId);
  const mid = target ? target.mid : 0;

  let delta = ((-90 - mid - cumulativeRotation) % 360 + 360) % 360;
  cumulativeRotation += delta + 360 * 5;

  const group = document.getElementById("wheelGroup");
  group.style.transform = `rotate(${cumulativeRotation}deg)`;

  setTimeout(() => {
    spinAnimating = false;
    // the host may have moved on while the wheel was spinning — show the latest state, not the one from spin time
    let latest = state;
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) latest = JSON.parse(raw) || state; } catch(e){}
    if (latest.phase === "winner") showWinnerBanner(latest); else renderPhaseVisuals(latest);
  }, 3300);
}

function render(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw){
    document.getElementById("emptyHint").classList.remove("hidden");
    return;
  }
  if (raw === lastRenderedHash) return;
  lastRenderedHash = raw;

  let state;
  try { state = JSON.parse(raw); } catch(e){ return; }
  if (!state.players || !state.players.length) return;

  document.getElementById("emptyHint").classList.add("hidden");
  updateBadges(state);
  renderCategoryFooter(state);

  if (state.phase === "winner"){
    showWinnerBanner(state);
    return;
  }

  const isNewSpin = state.spinSeq !== undefined && state.spinSeq !== lastSpinSeq;
  if (isNewSpin){
    lastSpinSeq = state.spinSeq;
    triggerSpin(state);
    return;
  }

  if (spinAnimating) return;

  renderPhaseVisuals(state);
}


/* ===== GAME SHOW LAYER ===== */
let _S=null,_stT=null,_lastTie=null;
const COL={pink:'#ff2ea6',cyan:'#2ee6ff',gold:'#f6c90e',green:'#4ade80',red:'#f87171'};
function stinger(main,sub,color,ms){
  ms=ms||2200; const el=document.getElementById('stinger');
  el.style.setProperty('--st-c',COL[color]||color||COL.gold); el.style.setProperty('--st-ms',ms+'ms');
  document.getElementById('stMain').textContent=main; document.getElementById('stSub').textContent=sub||'';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  const f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  clearTimeout(_stT); _stT=setTimeout(()=>el.classList.remove('show'),ms);
}
function drumroll(sec){const c=getAudioCtx();if(!c)return;const n=Math.floor(sec*22),t0=c.currentTime;
  for(let i=0;i<n;i++)playTone(150+i*4,t0+i*(sec/n),.06,'triangle',.08+.1*i/n);
  playTone(110,t0+sec,.5,'sawtooth',.25);playTone(220,t0+sec,.5,'square',.1);}
function stingSound(up){const c=getAudioCtx();if(!c)return;const t=c.currentTime;
  (up?[392,523.25,659.25,784,1046.5]:[392,311,247,196]).forEach((f,i)=>playTone(f,t+i*.09,.28,'sawtooth',.14));}
function spinTicks(){const c=getAudioCtx();if(!c)return;const N=44,t0=c.currentTime;
  for(let i=1;i<=N;i++)playTone(1200,t0+3.2*(1-Math.pow(1-i/N,2.3)),.03,'square',.08);}
const _rpv=renderPhaseVisuals;
renderPhaseVisuals=function(s){_S=s;
  if(s.phase==='tiebreak'){const k=s.roundNumber+'-'+s.activeId;if(k!==_lastTie){_lastTie=k;stinger('TIEBREAK!','Level on points — sudden death',COL.red,2400);drumroll(1.2);}}
  _rpv(s);};
const _dd=playDuelDing;
playDuelDing=function(){_dd();const s=_S;if(!s)return;const a=getPlayer(s,s.activeId),b=getPlayer(s,s.opponentId);
  if(a&&b){stinger('DUEL!',a.name+'  vs  '+b.name,COL.pink,2400);drumroll(1.4);}};
const _rw=playRoundWinFanfare;
playRoundWinFanfare=function(){_rw();const s=_S;if(!s)return;const w=getPlayer(s,s.activeId),l=getPlayer(s,s.opponentId);if(!w||!l)return;
  stinger(s.ownershipChanged?'⚡ STEAL! ⚡':'SLICE WON!',w.name+' absorbs '+l.name+(s.ownershipChanged?' — control flips!':''),s.ownershipChanged?COL.cyan:COL.green,2600);stingSound(true);};
const _sw=showWinnerBanner;
showWinnerBanner=function(s){_sw(s);const w=getPlayer(s,s.wheelOrder[0]);if(w)setTimeout(()=>stinger('🥧 CHAMPIONS 🥧',w.name+' owns the pie',COL.gold,4200),150);};
const _ts=triggerSpin;
triggerSpin=function(s){_ts(s);spinTicks();
  setTimeout(()=>{const p=getPlayer(s,s.activeId);if(p){stinger("YOU'RE UP!",p.name,COL.gold,1900);stingSound(true);}},3300);};
function renderBoard(s){
  const el=document.getElementById('board');if(!s.scoreHistory){el.classList.add('hidden');return;}
  const tot=id=>(s.scoreHistory[id]||[]).reduce((a,b)=>a+b,0);
  const top=[...s.players].sort((a,b)=>tot(b.id)-tot(a.id)).slice(0,5);
  if(!top.some(p=>tot(p.id)>0)){el.classList.add('hidden');return;}
  el.classList.remove('hidden');
  document.getElementById('boardRows').innerHTML=top.map((p,i)=>`<div class="row ${s.wheelOrder.includes(p.id)?'':'out'}"><b>${i+1}</b><span>${p.name}</span><em>${tot(p.id)}</em></div>`).join('');}
const _ub=updateBadges;
updateBadges=function(s){_ub(s);renderBoard(s);};
window.addEventListener("storage", (e) => { if (e.key === STORAGE_KEY) render(); });
setInterval(render, 700);
render();
</script>
